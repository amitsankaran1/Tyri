name: Deterministic checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show compiler
        run: swiftc --version
      - name: Run all deterministic suites
        run: bash scripts/check.sh
